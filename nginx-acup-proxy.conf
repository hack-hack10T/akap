# A CUP — reverse-proxy worker-роутов на workers.dev (расп. №12, вариант «а»).
# Применение: вставить в server-блок nginx для xn--80aa3av.xn--p1ai (REG.RU / ISPmanager),
# ПЕРЕД location / { try_files ... } (иначе SPA-фолбэк перехватит первым по префиксу? — nginx location: regex
# имеет приоритет над префиксным location /, так что порядок не критичен, но для ясности — до него).
# Проверка конфига: nginx -t; перезапуск: systemctl reload nginx / ISPmanager "Перезапустить nginx".

    # Worker acup-access (Cloudflare Workers) — все служебные пути
    location ~ ^/(api|pay|login|guide|access\.txt|payment/return|bot|health|admin|testnotify|app)(/|$) {
        proxy_pass https://acup-access.acup-access.workers.dev$request_uri;
        proxy_set_header Host acup-access.acup-access.workers.dev;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        # Webhook ЮKassa/Telegram приходят напрямую на workers.dev (не через nginx), эти пути — для браузера.
        # Origin браузера (https://акап.рф) сохраняется — worker пропускает по hostname (IDN-фикс уже задеплоен).
    }

    # Остальные пути — статика сайта (SPA-фолбэк остаётся как был):
    # location / { try_files $uri $uri/ /index.html; }
